name: Feature request
description: Propose an improvement or new capability
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the scenario and pain point first. "I need to solve Y" before "I want X".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternative
    attributes:
      label: Alternatives considered
